# Chromium/Electron launch flags for VSCode (read by the /usr/bin/code wrapper).
# Trying fixes for freezes on Nvidia + Hyprland (native Wayland) — one at a time.

# 1) Switch ANGLE backend to OpenGL — most common fix for nvidia+wayland freezes
--use-angle=opengl

# 2) If still freezing, uncomment to test under XWayland (diagnostic):
# --ozone-platform=x11

# 3) Big hammer if all else fails (stable but slower rendering):
# --disable-gpu-compositing
